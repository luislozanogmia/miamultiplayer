[extend]
useDefault = true

[allowlist]
description = "Known false positives"
paths = [
  # Placeholder values only (replace-with-...)
  '''backend/\.env\.example''',
  # Deliberately fake credential fixtures testing the leak scanner
  '''macos/scripts/package-mac\.test\.cjs''',
]
regexes = [
  # Clerk *publishable* keys are public identifiers, designed to ship in
  # client code (the secret key is sk_..., which stays blocked).
  '''pk_test_[A-Za-z0-9]+''',
  # Mia's production publishable key, human-approved; every other live
  # publishable key stays blocked.
  '''pk_live_Y2xlcmsubWlhbXVsdGlwbGF5ZXIuY29tJA==''',
]
