<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
<title>Mia Multiplayer Demo</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<link rel="stylesheet" href="multiplayer.css?v=20261030-demo-1" />
</head>
<body>
<!-- A local, scripted demo: the teammates, bots, pages and messages are
     made up, and nothing here talks to any server. -->
<header class="mpd-banner" role="banner">
  <span class="mpd-badge">Demo</span>
  <span class="mpd-copy"><strong>Multiplayer Demo</strong> · sample teammates and bots. Nothing here is real or sent anywhere.</span>
  <a class="mpd-back" href="/#/chat">Back to Mia</a>
</header>
<div class="mp-app">
  <section class="mp-browser" aria-label="Shared browser">
    <div class="mp-tabsrow">
      <button type="button" class="mp-icon-btn" aria-label="Your bots"><img src="../assets/mote/mote.svg" alt="" draggable="false" /></button>
      <div class="mp-tabs" id="tabs" role="tablist" aria-label="Shared tabs"></div>
      <div class="mp-presence" id="presence" aria-label="Players in this tab"></div>
    </div>
    <div class="mp-toolbar">
      <span class="mp-dot" aria-hidden="true"></span>
      <button type="button" class="mp-icon-btn" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button type="button" class="mp-icon-btn" aria-label="Forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button type="button" class="mp-icon-btn" aria-label="Reload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></button>
      <div class="mp-url" id="url"></div>
      <div class="mp-live" id="live"><img src="../assets/icons/mode-multiplayer.png" alt="" /><span class="mp-live-dot" aria-hidden="true"></span><span id="liveText">Multiplayer</span></div>
    </div>
    <div class="mp-screen" id="screen">
      <div class="mp-page" id="page"></div>
      <div class="mp-layer" id="layer" aria-hidden="true"></div>
    </div>
  </section>
  <aside class="mp-room" aria-label="Room chat">
    <header class="mp-room-head">
      <h1><img src="../assets/icons/mode-multiplayer.png" alt="" /><span id="roomTitle">Room</span></h1>
      <p id="roomSub">Everyone here sees the same tab.</p>
      <div class="mp-roster" id="roster"></div>
    </header>
    <div class="mp-msgs" id="msgs" aria-live="polite"></div>
    <form class="mp-composer" id="composer" autocomplete="off">
      <textarea id="composerInput" rows="1" placeholder="Message the demo room or @ a bot" aria-label="Message the demo room"></textarea>
      <button type="submit" class="mp-send" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </form>
  </aside>
</div>
<div class="mp-demo" role="group" aria-label="Demo controls">
  <span>Demo</span>
  <button type="button" id="pauseBtn">Pause</button>
  <button type="button" id="restartBtn">Restart</button>
</div>
<script src="multiplayer.js?v=20261030-demo-1"></script>
</body>
</html>
