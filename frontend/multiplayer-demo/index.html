<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; frame-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
<title>Mia Multiplayer Demo</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<link rel="stylesheet" href="demo-library.css?v=20261101-demo-6" />
</head>
<body>
<!-- Local, scripted demos: the teammates, bots, pages and messages are made
     up, and nothing here talks to any server. -->
<header class="mpd-banner" role="banner">
  <strong class="mpd-title">Multiplayer</strong>
  <span class="mpd-badge">Demo</span>
  <a class="mpd-back" href="/#/chat">Back to Mia</a>
</header>
<main class="lib" id="library">
  <h1>See what Mia can do</h1>
  <div class="lib-cols">
    <section aria-labelledby="soloHead">
      <h2 id="soloHead">Solo <span>- Your personal team of powerful AIs.</span></h2>
      <ul class="lib-list" id="soloList"></ul>
    </section>
    <section aria-labelledby="teamHead">
      <h2 id="teamHead">Multiplayer <span>- State-of-the-art collaboration between groups of humans and AIs.</span></h2>
      <ul class="lib-list" id="teamList"></ul>
    </section>
  </div>
</main>
<section class="player" id="player" aria-labelledby="playerTitle" hidden>
  <header class="player-bar">
    <button type="button" class="player-btn" id="playerClose"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>All demos</button>
    <div class="player-text">
      <h2 id="playerTitle"></h2>
      <p id="playerText"></p>
    </div>
    <button type="button" class="player-btn" id="playerReplay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>Replay</button>
    <button type="button" class="player-btn" id="playerNext">Next<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </header>
  <div class="player-stage" id="playerStage"><div class="player-win" id="playerWin"></div></div>
</section>
<script src="demo-library.js?v=20261101-demo-2"></script>
</body>
</html>
