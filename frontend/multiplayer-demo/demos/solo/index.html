      preview: 'Use the same period, or something different?' },

      think: ['Reading Finance Consolidation', 'Converting MXN to USD', 'Removing intercompany transfers', 'Building the PDF'],

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var $ = function(s){ return document.querySelector(s); };
  var thread = $('#chatThread'), input = $('#ccInput'), sugg = $('#ccInlineSuggestion'), send = $('#ccSend');

  var miaPreview = miaRow.querySelector('.row-preview'), miaTime = miaRow.querySelector('.chat-dm-time');
  var MIA_START = 'Hi! What would you like to work on?';
  var cursor = document.createElement('div');
  cursor.className = 'demo-cursor';
  cursor.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 2l15 11-6.5 1.2L16 21l-2.6 1.1-3.3-6.8L5 19z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  document.body.appendChild(cursor);

  var run = 0, step = 0, busy = false, started = false, skip = null, speaker = 'mia', botRow = null, viewer = null;

  function el(html){ var x = document.createElement('template'); x.innerHTML = html.trim(); return x.content.firstElementChild; }
  function wait(ms){ return new Promise(function(r){ var id = setTimeout(r, reduce ? 0 : ms); skip = function(){ clearTimeout(id); r(); }; }); }
  function bottom(){ thread.scrollTop = thread.scrollHeight; }
  function resize(){ input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; }
  function suggest(text){ suggText.textContent = text || ''; sugg.style.visibility = text && !input.value ? 'visible' : 'hidden'; }
  function stamp(row, t){ var tm = row.querySelector('.chat-msg-time'); if (tm) tm.textContent = t || 'now'; return row; }
  function divider(){ var d = el(T.div); d.textContent = 'Today'; thread.appendChild(d); }

  function youRow(text){
    var row = stamp(el(T.you)); var body = row.querySelector('.chat-msg-text');
    body.innerHTML = '<p class="chat-md-p"></p>'; body.firstChild.textContent = text;
    row.classList.add('demo-in'); return row;
  }
  function agentRow(html, who){
    var row = stamp(el(who === 'bot' ? T.bot : T.mia)); row.querySelector('.chat-msg-text').innerHTML = html;
    row.classList.add('demo-in'); return row;
  }
  function thinkingRow(who, text){
    var row = el(who === 'bot' ? T.bot : T.mia); var tm = row.querySelector('.chat-msg-time'); if (tm) tm.remove();
    var body = row.querySelector('.chat-msg-text');
    body.className = 'chat-msg-text chat-msg-thinking chat-msg-thinking-local';
    body.innerHTML = '<span class="chat-thinking-shimmer"></span>'; body.firstChild.textContent = text;
    row.classList.add('demo-in'); return row;
  }
  function setPreview(who, text){
    var row = who === 'bot' ? botRow : miaRow; if (!row) return;
    var p = row.querySelector('.row-preview'); if (p) { p.textContent = text; p.classList.remove('empty'); }
  }
  async function reveal(row, myRun){
    var blocks = [].slice.call(row.querySelector('.chat-msg-text').children);
    blocks.slice(1).forEach(function(b){ b.classList.add('demo-hide'); });
    bottom();
    for (var j = 1; j < blocks.length; j++){ await wait(320); if (myRun !== run) return false; blocks[j].classList.remove('demo-hide'); blocks[j].classList.add('demo-in'); bottom(); }
    return true;
  }

  // Cursor moves in page coordinates (the demo is a 1280x800 page).
  function at(node){ var r = node.getBoundingClientRect(); return [r.left + Math.min(r.width * 0.45, 60), r.top + r.height * 0.55]; }
  async function moveTo(node, myRun){
    var xy = at(node);
    if (!cursor.classList.contains('on')){ cursor.style.transition = 'none'; cursor.style.transform = 'translate(' + (xy[0] + 160) + 'px,' + (xy[1] + 140) + 'px)'; cursor.offsetWidth; cursor.style.transition = ''; cursor.classList.add('on'); await wait(120); }
    cursor.style.transform = 'translate(' + xy[0] + 'px,' + xy[1] + 'px)';
    await wait(850); return myRun === run;
  }
  async function clickAt(node, myRun){
    if (!(await moveTo(node, myRun))) return false;
    cursor.classList.remove('click'); cursor.offsetWidth; cursor.classList.add('click');
    node.classList.add('demo-press'); await wait(160); node.classList.remove('demo-press');

  }
  function hideCursor(){ cursor.classList.remove('on'); }

  async function think(who, steps, myRun, extra){
    var th = thinkingRow(who, steps[0]); thread.appendChild(th); bottom();
    var shim = th.querySelector('.chat-thinking-shimmer');
    for (var i = 1; i < steps.length; i++){ await wait(1000 + (extra || 0)); if (myRun !== run) return null; shim.textContent = steps[i]; }
    await wait(800); if (myRun !== run) return null;
    return th;
  }

  async function say(text, myRun){
    input.value = ''; resize(); suggest('');
    send.classList.add('demo-press'); setTimeout(function(){ send.classList.remove('demo-press'); }, 140);
    thread.appendChild(youRow(text)); bottom();
    setPreview(speaker, text);
    await wait(450); return myRun === run;
  }

  async function answer(s, myRun){
    var th = await think(s.who, s.think, myRun, s.pdf ? 250 : 0); if (!th) return false;
    var row = agentRow(s.reply, s.who); th.replaceWith(row);

      await wait(900); if (myRun !== run) return false;

    thread.appendChild(done);
    var open = el("<div class=\"agent-setup-actions mia-bot-draft-open\"><button type=\"button\" class=\"agent-setup-activate\" data-mia-bot-open>Open Finance Consolidation\u2019s chat</button></div>"); open.classList.add('demo-in'); thread.appendChild(open); bottom();

    botRow = el(T.botRow); botRow.classList.remove('active'); botRow.classList.add('demo-in');
    var p = botRow.querySelector('.row-preview'); if (p) { p.textContent = 'No messages yet'; }
    bots.innerHTML = ''; bots.appendChild(botRow); if (botsCount) botsCount.textContent = '1';
    await wait(1500); if (myRun !== run) return false;
    if (!(await clickAt(botRow, myRun))) return false;
    openBot(); await wait(300); hideCursor();
    return true;
  }

  function openBot(){
    speaker = 'bot';
    miaRow.classList.remove('active'); if (botRow) botRow.classList.add('active');
    thread.innerHTML = ''; divider();

  function openPdf(){
    viewer = el('<div class="chat-image-viewer demo-pdf" role="dialog" aria-modal="true" aria-label="' + "Financial consolidation - trailing quarter.pdf" + '">' + "\n<div class=\"demo-pdf-pages\">\n<section class=\"demo-pdf-page\">\n  <h1>Financial consolidation</h1>\n  <p class=\"sub\">Trailing quarter \u00b7 Jul 29 \u2013 Oct 26, 2026 \u00b7 All amounts in USD</p>\n  <div class=\"kpis\">\n    <div class=\"kpi\"><small>Consolidated cash</small><b>$2,481,300</b></div>\n    <div class=\"kpi\"><small>Revenue (quarter)</small><b>$1,126,450</b></div>\n    <div class=\"kpi\"><small>Operating margin</small><b>18.4%</b></div>\n  </div>\n  <h2>Balances by entity</h2>\n  <table>\n    <tr><th>Entity</th><th>Currency</th><th class=\"n\">Local balance</th><th class=\"n\">USD</th></tr>\n    <tr><td>Northwind US Inc.</td><td>USD</td><td class=\"n\">1,742,900</td><td class=\"n\">1,742,900</td></tr>\n    <tr><td>Northwind M\u00e9xico S.A. de C.V.</td><td>MXN</td><td class=\"n\">13,409,500</td><td class=\"n\">738,400</td></tr>\n    <tr class=\"total\"><td>Consolidated</td><td></td><td class=\"n\"></td><td class=\"n\">2,481,300</td></tr>\n  </table>\n  <h2>Exchange rate</h2>\n  <p style=\"margin:0\">MXN \u2192 USD at 18.16, the quarter-end rate from the Finance Consolidation sheet.</p>\n  <div class=\"foot\"><span>Prepared by Finance Consolidation bot</span><span>Page 1 of 2</span></div>\n</section>\n<section class=\"demo-pdf-page\">\n  <h1>Month by month</h1>\n  <p class=\"sub\">Revenue by entity, USD thousands</p>\n  <div class=\"bars\">\n    <div class=\"bar\"><i class=\"mx\" style=\"height:28px\"></i><i class=\"us\" style=\"height:62px\"></i>Aug</div>\n    <div class=\"bar\"><i class=\"mx\" style=\"height:31px\"></i><i class=\"us\" style=\"height:66px\"></i>Sep</div>\n    <div class=\"bar\"><i class=\"mx\" style=\"height:35px\"></i><i class=\"us\" style=\"height:71px\"></i>Oct</div>\n  </div>\n  <table>\n    <tr><th>Month</th><th class=\"n\">U.S.</th><th class=\"n\">Mexico</th><th class=\"n\">Total</th></tr>\n    <tr><td>August</td><td class=\"n\">248.1</td><td class=\"n\">112.6</td><td class=\"n\">360.7</td></tr>\n    <tr><td>September</td><td class=\"n\">262.4</td><td class=\"n\">121.9</td><td class=\"n\">384.3</td></tr>\n    <tr><td>October</td><td class=\"n\">244.8</td><td class=\"n\">136.7</td><td class=\"n\">381.5</td></tr>\n    <tr class=\"total\"><td>Quarter</td><td class=\"n\">755.3</td><td class=\"n\">371.2</td><td class=\"n\">1,126.5</td></tr>\n  </table>\n  <h2>Notes</h2>\n  <ul>\n    <li>Mexico revenue grew 21% from August to October.</li>\n    <li>One intercompany transfer of $40,000 was removed to avoid double counting.</li>\n    <li>Two MX bank fees are not in the sheet yet. Flagged for review.</li>\n  </ul>\n  <div class=\"foot\"><span>Prepared by Finance Consolidation bot</span><span>Page 2 of 2</span></div>\n</section>\n</div>\n" + '<button type="button" class="chat-image-viewer-close" aria-label="Close">×</button></div>');

    document.body.appendChild(viewer);
  }
  function closePdf(){ if (viewer) { viewer.remove(); viewer = null; } }

  async function play(myRun){
    while (step < SCENES.length){
      var s = SCENES[step];
      suggest(s.ask);
      await wait(step === 0 ? 900 : 1500); if (myRun !== run) return;
      if (input.value) return;              // visitor started typing: hand over
      suggest('');
      busy = true;
      for (var i = 1; i <= s.ask.length; i++){
        input.value = s.ask.slice(0, i); resize();
        await wait(26 + Math.random() * 28); if (myRun !== run) return;
      }
      await wait(350); if (myRun !== run) return;
      step++;
      if (!(await say(s.ask, myRun))) return;
      if (!(await (s.draft ? draft(myRun) : answer(s, myRun)))) return;
      busy = false;
    }
    suggest('');
    input.placeholder = 'What should I ask ' + BOT + '?';
  }

  function reset(){
    run++; step = 0; busy = false; speaker = 'mia'; botRow = null;
    closePdf(); hideCursor();
    thread.innerHTML = ''; divider();
    bots.innerHTML = '<div class="chat-sidebar-empty">No bots yet</div>'; if (botsCount) botsCount.textContent = '';
    miaRow.classList.add('active');
    input.value = ''; resize(); input.placeholder = '';
    miaPreview.textContent = MIA_START; if (miaTime) miaTime.textContent = 'now';
  }

  function start(){ if (started) return; started = true; reset(); play(run); }
  function replay(){ started = true; reset(); play(run); }

  async function submitOwn(){
    var text = input.value.trim(); if (!text || busy) return;
    run++; busy = true; var myRun = run; hideCursor();
    if (!(await say(text, myRun))) return;
    var th = await think(speaker, ['Thinking through this'], myRun); if (!th) return;
    th.replaceWith(agentRow(FREE, speaker)); bottom();
    busy = false;
  }

  input.addEventListener('input', function(){ if (!busy) { resize(); suggest(input.value ? '' : suggText.textContent); } });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Tab' && !input.value && suggText.textContent){ e.preventDefault(); if (skip) skip(); }
    else if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if (!busy) submitOwn(); }
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closePdf(); });
  send.addEventListener('click', function(){ if (busy) return; if (input.value.trim()) submitOwn(); else if (skip) skip(); });
  // The visitor can open the PDF and the bot chat themselves.
  document.addEventListener('click', function(e){
    if (e.target.closest('[data-chat-artifact-preview]')) { e.preventDefault(); openPdf(); return; }
    if (botRow && !busy && (e.target.closest('[data-mia-bot-open]') || botRow.contains(e.target)) && speaker !== 'bot') { run++; openBot(); return; }
    if (!e.target.closest('#ccSend, #ccInput, .chat-image-viewer')) e.preventDefault();
  }, true);

  reset();
  window.miaDemo = { start: start, replay: replay };
  if (window.top === window) start();
})();
