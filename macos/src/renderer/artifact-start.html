<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Mia Artifacts</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #202124;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        border-left: 1px solid #e2e3df;
      }
      main {
        width: min(420px, calc(100% - 48px));
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.25; }
      p { margin: 0; color: #6a6d70; font-size: 14px; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <h1>Open an artifact</h1>
      <p>Enter an http or https URL, localhost address, or absolute local file path above.</p>
    </main>
  </body>
</html>
